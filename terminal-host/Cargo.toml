[package]
name = "terminal-host"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9"
rand = "0.8"
dirs = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
which = "7"
futures-util = "0.3"
zip = "2"
rfd = "0.15"
